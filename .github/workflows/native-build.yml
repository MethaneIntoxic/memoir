name: Native mobile build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'packages/memoir-core/**'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix mobile
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null
          for attempt in 1 2 3; do
            if "$sdkmanager_path" 'platforms;android-36' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973'; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.0.12077973" "$ANDROID_SDK_ROOT/.temp"
            sleep $((attempt * 5))
          done
      - name: Prepare verified mobile model
        run: npm --prefix mobile run prepare:model
      - name: Synchronize Capacitor projects
        run: npm --prefix mobile run cap:sync
      - name: Build arm64 debug APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: memoir-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile/package-lock.json
      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix mobile
      - name: Prepare verified mobile model
        run: npm --prefix mobile run prepare:model
      - name: Synchronize Capacitor projects
        run: npm --prefix mobile run cap:sync
      - name: Resolve native packages
        run: xcodebuild -resolvePackageDependencies -project mobile/ios/App/App.xcodeproj -scheme App
      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project mobile/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath output/ios-derived-data
          CODE_SIGNING_ALLOWED=NO
          build
