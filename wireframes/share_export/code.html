<style>
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        .hard-shadow {
            box-shadow: 4px 4px 0px 0px #1A1A1A;
        }
        .hard-shadow-sm {
            box-shadow: 2px 2px 0px 0px #1A1A1A;
        }
        .hard-border {
            border: 1px solid #1A1A1A;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center relative">
<div class="noise-overlay"></div>
<!-- Background Dimmer simulating Memoir Reader -->
<div class="absolute inset-0 bg-surface-dim/80 backdrop-blur-sm flex flex-col z-0 overflow-hidden">
<header class="flex justify-between items-center w-full px-6 py-4 max-w-container-max mx-auto opacity-50">
<span class="material-symbols-outlined text-stone-900">menu</span>
<span class="font-serif italic text-2xl tracking-tighter text-stone-900">MEMOIR</span>
<img alt="User Profile" class="w-8 h-8 rounded-full hard-border" data-alt="Vintage style black and white portrait of a person" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5krelQFnU5NuudC47ZX4z6TwBuwBKVGSgzsh_QSNWxWbI7GMlqhyhGiH4jsdsd8R0iFarXVrhuy9TM0f_BHtkuDSsnxKQryqdTpcS8Dj9oXxn43H37SBHBeqdE_0bUV-1JgowQ_Za83zmkIYXe1OV-NGEt5A8XvMXOMDTgXw5MNAYksx2h-AjSIbqAVaM15EYiqlByIWZIst76TvuyEn_DcrEJXsmwHMJAt7Sm2VunHN-opB4zT_f1CODXc07YA1Y8BBsyxFubwDJ"/>
</header>
<main class="flex-grow max-w-container-max mx-auto w-full px-edge-margin pt-stack-gap-lg opacity-40">
<h1 class="font-display-xl text-display-xl text-on-surface mb-stack-gap-lg">Summer in Kyoto</h1>
<p class="font-body-main text-body-main text-on-surface-variant mb-stack-gap-md">The cicadas were deafening that July. We walked through Arashiyama...</p>
<div class="w-full aspect-video bg-surface-container-high hard-border mt-stack-gap-lg relative">
<img alt="Kyoto Bamboo Forest" class="w-full h-full object-cover" data-alt="Bamboo forest in Kyoto, Japan, cinematic lighting, soft nostalgic mood" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJosqy23oqhfcp2u6dufTTKYBjPUyhOzqEqYrUgoorBuuROltVd0mPk1VCmrxto5u98FcMMqU8MTV3M951WHUCl-Pz31DYv89fhtqTzlXzeVC9fDkLjupYOxNGizgYZrpRc5hDqK1BeDKR2TL4gLJI28MNM6MtRw-HpY8pSzfYoY0QxOc4U0r5fHM36GRCKtBhc0ndYSPGHmCDWT36m3oJ-HEwttsdY8MDYD9ZGB_Fj0MdMYxh7sVjjjpz3p2z6Zqf2qE8Oof3qGVA"/>
</div>
</main>
</div>
<!-- Modal Overlay Container -->
<div class="relative z-10 w-full max-w-[400px] px-edge-margin flex flex-col items-center justify-center min-h-screen">
<!-- Modal Card -->
<div class="w-full bg-surface hard-border hard-shadow p-6 relative rounded-DEFAULT">
<!-- Close Button -->
<button class="absolute top-4 right-4 text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Header -->
<div class="mb-8 mt-2">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Distribute</h2>
<p class="font-body-main text-body-main text-on-surface-variant text-sm">Select how you'd like to share your completed memoir.</p>
</div>
<!-- Options Stack -->
<div class="flex flex-col gap-4">
<!-- Save as PDF -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hard-border hard-shadow-sm hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-none transition-all duration-200 group rounded-DEFAULT">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
<span class="font-label-caps text-label-caps text-on-surface group-hover:text-primary transition-colors">Save as PDF</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Export to Web Link -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hard-border hard-shadow-sm hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-none transition-all duration-200 group rounded-DEFAULT">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">link</span>
<span class="font-label-caps text-label-caps text-on-surface group-hover:text-primary transition-colors">Export to Web Link</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Share to Pinterest -->
<button class="w-full flex items-center justify-between p-4 bg-surface-container-lowest hard-border hard-shadow-sm hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-none transition-all duration-200 group rounded-DEFAULT">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">push_pin</span>
<span class="font-label-caps text-label-caps text-on-surface group-hover:text-primary transition-colors">Share to Pinterest</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Order Physical Print -->
<button class="w-full flex items-center justify-between p-4 bg-on-surface text-surface hard-border hard-shadow-sm hover:translate-y-[2px] hover:translate-x-[2px] hover:shadow-none transition-all duration-200 group mt-2 rounded-DEFAULT">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-label-caps text-label-caps text-surface">Order Physical Print</span>
</div>
<span class="material-symbols-outlined text-surface text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
